name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setting Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: install deps
        run: pnpm install
        working-directory: docs

      - name: run Rslint check
        run: pnpm run lint
        working-directory: docs

      - name: run Prettier fmt
        run: pnpm run format:check
        working-directory: docs

  crates:
    name: Rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [ app ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.crate }}-
            ${{ runner.os }}-cargo-

      # 仅在一个 crate 上运行 fmt
      - name: Check formatting (fmt)
        if: matrix.crate == 'app'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -p ${{ matrix.crate }} -- -D warnings

      - name: Run tests
        run: cargo test -p ${{ matrix.crate }}