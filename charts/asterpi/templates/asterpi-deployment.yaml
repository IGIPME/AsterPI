apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-asterpi
  labels:
    app: asterpi
spec:
  replicas: {{ .Values.asterpi.replicas }}
  selector:
    matchLabels:
      app: asterpi
  template:
    metadata:
      labels:
        app: asterpi
    spec:
      containers:
        - name: asterpi
          image: "{{ .Values.asterpi.image.repository }}:{{ .Values.asterpi.image.tag }}"
          imagePullPolicy: {{ .Values.asterpi.image.pullPolicy }}
          ports:
            - containerPort: 3000